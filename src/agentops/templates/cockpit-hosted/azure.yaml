# AgentOps hosted Cockpit — azd project manifest.
#
# Defines a single App Service-hosted Python service so `azd provision` and
# `azd deploy` can create the infrastructure in infra/main.bicep and deploy
# the minimal FastAPI/Uvicorn entrypoint in app/main.py. This manifest never
# declares a hook, resource, or service outside the Cockpit Web App itself:
# it does not provision Foundry accounts/projects, Log Analytics workspaces,
# Application Insights, or any Microsoft Entra ID object. Those are either
# referenced (read-only) from main.bicep or configured out-of-band by the
# CLI/service layer (see infra/main.bicep for details).
name: agentops-cockpit-hosted
metadata:
  template: agentops-cockpit-hosted@1

infra:
  provider: bicep
  path: infra
  module: main

services:
  cockpit:
    project: ./app
    language: py
    host: appservice
