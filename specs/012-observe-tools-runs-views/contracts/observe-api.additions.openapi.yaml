openapi: 3.1.0
info:
  title: AgentOps Observe API — tools and runs additions
  version: 1.1.0
  description: |
    Delta contract for spec 012 (Observe tools and runs views).

    This document describes ONLY what changes relative to the authoritative
    contract at `specs/011-deploy-hosted-cockpit/contracts/observe-api.openapi.yaml`,
    version 1.0.0. Paths, security schemes, error responses, and every schema not
    listed here are unchanged and are not restated.

    Change classes used below:
      * ADDITIVE  — new schema or new optional property; existing clients unaffected.
      * BREAKING  — an existing enum's members are replaced.

    The single BREAKING change is `ObservedAgent.source_kind`. It is accepted and
    justified in `specs/012-observe-tools-runs-views/plan.md` under Complexity
    Tracking, with the old-to-new mapping table. The mapping is deliberately NOT
    one-to-one, so no automatic upgrade shim can be correct.

    `ObservedAgent` also gains a required `source_id` property. That change is
    ADDITIVE, not breaking: consumers receive strictly more information. It is
    made here so that all three row-bearing views (agents, tools, runs) attribute
    their rows to a telemetry source consistently in one release.

    The API remains strictly read-only. Nothing in this delta introduces a write
    path, and both new views are projections over telemetry the caller is already
    authorized to read.
servers:
  - url: /

paths:
  /api/observe/query:
    post:
      operationId: queryObserveView
      description: |
        UNCHANGED path, request shape, authorization behaviour, and error mapping.
        Only the accepted `view` values and the response envelope's optional
        `bounds` property change. See components below.
      responses:
        "200":
          description: |
            Unchanged envelope, with one ADDITIVE optional property (`bounds`).
            When `view` is `tools` the `data` array contains `ObservedTool` items;
            when `view` is `runs` it contains `ObservedRun` items.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObserveQueryResponseDelta"

components:
  schemas:

    # ------------------------------------------------------------------
    # BREAKING — replaces the three-value set on ObservedAgent.source_kind
    # ------------------------------------------------------------------
    RuntimeKind:
      description: |
        BREAKING (replaces `["foundry", "external", "unknown"]`).

        Shared by ObservedAgent, ObservedTool, and ObservedRun.

        Old -> new mapping (not one-to-one):
          foundry  -> foundry_hosted OR foundry_prompt
          external -> external_registered OR external_unregistered
          (none)   -> copilot_studio
          unknown  -> unknown

        `unknown` is a first-class expected outcome, not an error. It is returned
        whenever the joined telemetry and control-plane evidence is insufficient
        to classify the runtime. Consumers MUST NOT treat it as a failure or
        substitute a guess.
      type: string
      enum:
        - foundry_hosted
        - foundry_prompt
        - external_registered
        - external_unregistered
        - copilot_studio
        - unknown

    # ------------------------------------------------------------------
    # ADDITIVE — source attribution on the existing agents view
    # ------------------------------------------------------------------
    ObservedAgentDelta:
      description: |
        ADDITIVE. Lists ONLY the property added to the existing `ObservedAgent`
        schema. Every other property is unchanged and is not restated here.
        The separate BREAKING retarget of `ObservedAgent.source_kind` to
        `RuntimeKind` is described above and is not repeated here.

        `source_id` identifies which telemetry source produced the row. Agent
        rows, like tool and run rows, are produced by one query per source and
        concatenated — never merged — so without this property two sources
        reporting the same agent yield two rows a consumer cannot tell apart.
        Required and non-nullable: the value is always known at normalization
        time from the source being queried, so no KQL change is involved.

        Adding a required property to a response schema is additive for
        consumers, which receive strictly more information.
      type: object
      properties:
        source_id:
          description: |
            Identifier of the telemetry source that produced this row (FR-023A).
          type: string
          minLength: 1
      required:
        - source_id

    # ------------------------------------------------------------------
    # ADDITIVE — request additions
    # ------------------------------------------------------------------
    ObserveViewDelta:
      description: |
        ADDITIVE. `ObserveQueryRequest.view` gains two members. Existing members
        (`overview`, `agents`, `models`, `coverage`) are unchanged.
      type: string
      enum:
        - overview
        - agents
        - models
        - coverage
        - tools
        - runs

    ObserveFilterStateDelta:
      description: |
        ADDITIVE. Two optional narrowing-only filters are added to the existing
        ObserveFilterState. All existing properties are unchanged and are not
        restated here.

        Neither filter can widen scope: both are applied inside a query already
        bounded to the caller's authorized sources, so they can only reduce a
        result set the caller is already entitled to see. `validate_scope` is
        therefore unchanged and does not inspect them. Both values are trimmed,
        length-bounded, and escaped on the server before use.
      type: object
      properties:
        tool_name:
          description: Narrow results to a single tool name. Metadata, never message content.
          type: [string, "null"]
          minLength: 1
          maxLength: 256
          default: null
        run_key:
          description: Narrow results to a single run correlation identifier.
          type: [string, "null"]
          minLength: 1
          maxLength: 256
          default: null

    # ------------------------------------------------------------------
    # ADDITIVE — new row entities
    # ------------------------------------------------------------------
    ObservedTool:
      description: |
        ADDITIVE. One row per (source, project, agent, tool) grouping in the query
        window. `source_id` names the originating telemetry source: rows from
        different sources are concatenated, never merged, so without it two
        sources reporting the same agent and tool would be indistinguishable.

        NOTE: `input_tokens` and `output_tokens` are deliberately ABSENT from this
        schema, unlike ObservedAgent and ModelUsage. Attributing token consumption
        to an individual tool invocation is out of scope. Consumers MUST NOT
        synthesize these fields or infer that their absence means zero. The server
        model forbids extra properties, so a response carrying them is invalid.
      type: object
      additionalProperties: false
      required:
        - source_id
        - tool_name
        - agent_key
        - source_kind
        - last_seen
        - invocations
        - failures
      properties:
        source_id:
          description: Originating telemetry source for this row.
          type: string
          minLength: 1
        tool_name:
          type: string
          minLength: 1
        agent_key:
          type: string
          minLength: 1
        agent_id:
          type: [string, "null"]
          default: null
        agent_name:
          type: [string, "null"]
          default: null
        project_resource_id:
          type: [string, "null"]
          default: null
        foundry_resource_id:
          type: [string, "null"]
          default: null
        source_kind:
          $ref: "#/components/schemas/RuntimeKind"
        last_seen:
          type: string
          format: date-time
        invocations:
          description: Tool-meter allocation key for future cost attribution work.
          type: integer
          minimum: 0
        failures:
          description: Subset of `invocations`; server asserts failures <= invocations.
          type: integer
          minimum: 0
        p95_latency_ms:
          description: |
            `null` when latency is not measurable. `null` and `0` are different
            answers and MUST NOT be conflated.
          type: [number, "null"]
          minimum: 0
          default: null

    ObservedRun:
      description: |
        ADDITIVE. One row per correlated agent execution in the query window.

        Rows in a single response may legitimately mix `run_key_kind` values: a
        `conversation` run may span many turns while a `trace` run is exactly one
        turn. Clients MUST surface `run_key_kind` so the two are not compared as
        if they were equivalent.

        NOTE: unlike ObservedTool, runs DO carry token totals, because a run
        aggregates model activity that already reports usage. The fields are
        nullable: `null` means no activity inside the run reported usage and MUST
        be rendered as "not available", never coerced to 0.

        NOTE: `started_at`, `duration_ms`, `turns`, `failed_turns` and `status`
        are scoped to the queried time range. `status` reports the TRAILING edge
        only: a run still active at the end of the window is `in_progress`. A run
        that began BEFORE the window is not flagged, so its reported start,
        duration and counts describe activity inside the window rather than the
        run's absolute lifetime. Clients MUST present these as window-scoped.
      type: object
      additionalProperties: false
      required:
        - source_id
        - run_key
        - run_key_kind
        - agent_key
        - source_kind
        - started_at
        - last_activity_at
        - status
        - turns
        - failed_turns
        - tool_invocations
        - tool_failures
      properties:
        source_id:
          description: Originating telemetry source for this row.
          type: string
          minLength: 1
        run_key:
          type: string
          minLength: 1
        run_key_kind:
          description: |
            Which correlation formed this row. `conversation` is preferred when
            session identity is present; `trace` is the always-available fallback.
          type: string
          enum: [conversation, trace]
        agent_key:
          type: string
          minLength: 1
        agent_id:
          type: [string, "null"]
          default: null
        agent_name:
          type: [string, "null"]
          default: null
        project_resource_id:
          type: [string, "null"]
          default: null
        foundry_resource_id:
          type: [string, "null"]
          default: null
        source_kind:
          $ref: "#/components/schemas/RuntimeKind"
        started_at:
          type: string
          format: date-time
        last_activity_at:
          description: Server asserts last_activity_at >= started_at.
          type: string
          format: date-time
        duration_ms:
          description: Compute allocation key for future cost attribution work.
          type: [number, "null"]
          minimum: 0
          default: null
        status:
          description: |
            Outcome and completeness in one field.

            `in_progress` means the run's last activity falls within the
            120-second settling margin of the query window end, so the run may
            not be finished. `succeeded` and `failed` are only reported once a
            run has settled.

            A run is `failed` if ANY turn or ANY tool invocation failed. Later
            recovery within the same run does not clear it.
          type: string
          enum: [succeeded, failed, in_progress]
        turns:
          description: |
            One turn is one request and its response. A single-trace run has
            exactly one turn. This is NOT derived from model-call count.
          type: integer
          minimum: 1
        failed_turns:
          description: Subset of `turns`; server asserts failed_turns <= turns.
          type: integer
          minimum: 0
        tool_invocations:
          type: integer
          minimum: 0
        tool_failures:
          description: Server asserts tool_failures <= tool_invocations.
          type: integer
          minimum: 0
        input_tokens:
          description: |
            Total observed input tokens across the run. `null` means usage was
            not reported; it is NOT zero.
          type: [integer, "null"]
          minimum: 0
          default: null
        output_tokens:
          description: |
            Total observed output tokens across the run. `null` means usage was
            not reported; it is NOT zero.
          type: [integer, "null"]
          minimum: 0
          default: null
      allOf:
        - description: |
            When `status` is `succeeded`, both `failed_turns` and `tool_failures`
            MUST be 0. Enforced server-side by a model validator.
          if:
            properties:
              status:
                const: succeeded
            required: [status]
          then:
            properties:
              failed_turns:
                const: 0
              tool_failures:
                const: 0

    ResultBounds:
      description: |
        ADDITIVE. Reports how much of the in-scope data a row-bounded view
        actually returned, so a truncated table is never mistaken for a complete
        one.
      type: object
      additionalProperties: false
      required: [rows_shown, truncated]
      properties:
        rows_shown:
          type: integer
          minimum: 0
        rows_total_in_scope:
          description: |
            `null` means the total could not be determined for this response —
            NOT that it equals `rows_shown`. When present it is always
            >= `rows_shown`.
          type: [integer, "null"]
          minimum: 0
          default: null
        truncated:
          description: True when the server row bound discarded rows.
          type: boolean
          default: false

    # ------------------------------------------------------------------
    # ADDITIVE — coverage dimension additions
    # ------------------------------------------------------------------
    CoverageDimensionDelta:
      description: |
        ADDITIVE. `CoverageResult.dimension` gains two members so an absent tool
        or run signal is explained rather than rendered as an empty table. All
        existing members are unchanged. `CoverageState` is unchanged.

        An agent whose runtime resolves to `unknown` continues to be reported
        through the existing `agent_attribution` dimension, because the cause is
        the same missing-identity signal that dimension already describes.
      type: string
      enum:
        - resource_access
        - telemetry_connection
        - recent_traces
        - agent_attribution
        - model_attribution
        - token_usage
        - trace_correlation
        - protected_content
        - tool_attribution
        - run_correlation

    # ------------------------------------------------------------------
    # ADDITIVE — response envelope addition
    # ------------------------------------------------------------------
    ObserveQueryResponseDelta:
      description: |
        ADDITIVE. The existing query response envelope gains one optional
        property. `data`, `coverage`, `diagnostics`, `partial_failures`,
        `refreshed_at`, and `cache_status` are unchanged and are not restated.
      type: object
      properties:
        data:
          description: |
            View-dependent payload. Unchanged for existing views. For `tools` it
            is an array of ObservedTool; for `runs` an array of ObservedRun.
          oneOf:
            - type: array
              items:
                $ref: "#/components/schemas/ObservedTool"
            - type: array
              items:
                $ref: "#/components/schemas/ObservedRun"
        bounds:
          description: |
            Present for row-bounded views (`agents`, `models`, `tools`, `runs`).
            `null` or absent for views that are not row-bounded.
          oneOf:
            - $ref: "#/components/schemas/ResultBounds"
            - type: "null"
          default: null
