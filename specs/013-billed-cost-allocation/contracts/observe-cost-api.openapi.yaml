openapi: 3.1.0
info:
  title: AgentOps Observe API - cost allocation additions
  version: 1.2.0
  description: |
    Additive delta for spec 013 relative to the authoritative Observe API in
    specs 011 and the tools/runs delta in spec 012.

    The existing POST /api/observe/query path, authorization, diagnostics,
    partial-failure behavior, cache metadata, and error mapping are reused.
    The runtime remains read-only. This contract introduces no billing API,
    write path, credential, or role.
servers:
  - url: /

paths:
  /api/observe/query:
    post:
      operationId: queryObserveView
      description: |
        Existing operation. `view: cost` selects CostViewData. Cost selectors
        are validated against the startup-loaded CostModel after ObserveScope
        authorization has bounded telemetry sources.
      responses:
        "200":
          description: |
            Full or partial result. When `view` is `cost`, `data` is
            CostViewData and coverage contains per-component cost_attribution
            entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObserveCostResponse"
        "422":
          description: |
            Cost period/component selector is malformed or is not present in
            the configured model.
        "503":
          description: |
            A cost request was made while AGENTOPS_COST_MODEL is invalid.
            Existing non-cost Observe requests remain available.

components:
  schemas:
    ObserveViewDelta:
      description: Additive extension of the current Observe view enum.
      type: string
      enum:
        - overview
        - agents
        - models
        - coverage
        - tools
        - runs
        - cost

    CostBreakdown:
      type: string
      enum: [agents, tools, runs]

    ObserveFilterStateCostDelta:
      description: |
        Additive optional properties on ObserveFilterState. They contain
        identifiers only, round-trip through the shared page URL, and do not
        widen ObserveScope. Only added properties are shown; existing filter
        properties remain valid and unchanged.
      type: object
      properties:
        cost_period_id:
          type: [string, "null"]
          minLength: 1
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
          default: null
        cost_breakdown:
          oneOf:
            - $ref: "#/components/schemas/CostBreakdown"
            - type: "null"
          default: null
        cost_component_id:
          type: [string, "null"]
          minLength: 1
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
          default: null
        cost_agent_key:
          description: |
            Post-allocation row filter for agent drill-down. It never changes
            the full-period denominator or any allocated amount.
          type: [string, "null"]
          minLength: 1
          maxLength: 512
          default: null

    RuntimeKind:
      type: string
      enum:
        - foundry_hosted
        - foundry_prompt
        - external_registered
        - external_unregistered
        - copilot_studio
        - unknown

    AllocationModel:
      type: string
      enum: [metered, commitment]

    AllocationKey:
      type: string
      enum:
        - weighted_tokens
        - total_tokens
        - tool_invocations
        - active_session_seconds
        - credits
        - credit_events

    CostConfidence:
      type: string
      enum: [high, medium, low, unavailable]

    BillingBoundary:
      type: object
      additionalProperties: false
      required: [kind, value]
      properties:
        kind:
          type: string
          enum: [resource, subscription, account, pool, custom]
        value:
          type: string
          minLength: 1
          maxLength: 512
        label:
          type: [string, "null"]
          minLength: 1
          maxLength: 128
          default: null

    CostPeriodRef:
      type: object
      additionalProperties: false
      required: [id, starts_at, ends_at]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time

    CostAllocationRow:
      type: object
      additionalProperties: false
      required:
        - period_id
        - starts_at
        - ends_at
        - component_id
        - component_type
        - billing_boundary
        - billed_source
        - allocation_model
        - preferred_key
        - applied_key
        - fallback_used
        - breakdown
        - consumer_kind
        - consumer_key
        - amount
        - currency
        - currency_minor_units
        - usage_numerator
        - usage_denominator
        - usage_unit
        - rounding_adjustment_minor_units
        - confidence
        - coverage_state
        - calculated_at
      properties:
        period_id:
          type: string
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        component_id:
          type: string
        component_type:
          type: string
          enum:
            - provisioned_throughput
            - standard_model
            - search
            - grounding
            - content_safety
            - storage
            - hosted_compute
            - customer_compute
            - credit_payg
            - credit_prepaid
        billing_boundary:
          $ref: "#/components/schemas/BillingBoundary"
        billed_source:
          type: string
        allocation_model:
          $ref: "#/components/schemas/AllocationModel"
        preferred_key:
          $ref: "#/components/schemas/AllocationKey"
        applied_key:
          $ref: "#/components/schemas/AllocationKey"
        fallback_used:
          type: boolean
        breakdown:
          $ref: "#/components/schemas/CostBreakdown"
        consumer_kind:
          type: string
          enum: [agent, tool, run, unattributed]
        consumer_key:
          type: string
          minLength: 1
        source_resource_id:
          type: [string, "null"]
          default: null
        project_resource_id:
          type: [string, "null"]
          default: null
        agent_key:
          type: [string, "null"]
          default: null
        tool_name:
          type: [string, "null"]
          default: null
        run_key:
          type: [string, "null"]
          default: null
        amount:
          $ref: "#/components/schemas/DecimalString"
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        currency_minor_units:
          type: integer
          minimum: 0
          maximum: 6
        usage_numerator:
          $ref: "#/components/schemas/DecimalString"
        usage_denominator:
          $ref: "#/components/schemas/DecimalString"
        usage_unit:
          $ref: "#/components/schemas/AllocationKey"
        rounding_adjustment_minor_units:
          type: integer
          minimum: 0
          maximum: 1
        confidence:
          $ref: "#/components/schemas/CostConfidence"
        coverage_state:
          type: string
          enum:
            - available
            - partial
            - inaccessible
            - not_configured
            - not_found
            - no_data
            - not_reported
            - protected
            - error
        coverage_reason:
          type: [string, "null"]
          default: null
        calculated_at:
          type: string
          format: date-time
        latest_observed_at:
          type: [string, "null"]
          format: date-time
          default: null

    CostComponentSummary:
      type: object
      additionalProperties: false
      required:
        - component_id
        - component_type
        - billing_boundary
        - billed_source
        - allocation_model
        - preferred_key
        - declared_total
        - attributed_amount
        - unattributed_amount
        - unallocated_amount
        - omitted_allocated_amount
        - currency
        - currency_minor_units
        - rows_shown
        - rows_total
        - confidence
        - coverage_state
      properties:
        component_id:
          type: string
        component_type:
          type: string
        billing_boundary:
          $ref: "#/components/schemas/BillingBoundary"
        billed_source:
          type: string
        allocation_model:
          $ref: "#/components/schemas/AllocationModel"
        preferred_key:
          $ref: "#/components/schemas/AllocationKey"
        applied_key:
          oneOf:
            - $ref: "#/components/schemas/AllocationKey"
            - type: "null"
          default: null
        declared_total:
          $ref: "#/components/schemas/DecimalString"
        attributed_amount:
          $ref: "#/components/schemas/DecimalString"
        unattributed_amount:
          $ref: "#/components/schemas/DecimalString"
        unallocated_amount:
          $ref: "#/components/schemas/DecimalString"
        omitted_allocated_amount:
          $ref: "#/components/schemas/DecimalString"
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        currency_minor_units:
          type: integer
          minimum: 0
          maximum: 6
        rows_shown:
          type: integer
          minimum: 0
        rows_total:
          type: integer
          minimum: 0
        confidence:
          $ref: "#/components/schemas/CostConfidence"
        coverage_state:
          type: string
        coverage_reason:
          type: [string, "null"]
          default: null
        next_action:
          type: [string, "null"]
          default: null

    CurrencySubtotal:
      type: object
      additionalProperties: false
      required:
        - currency
        - currency_minor_units
        - declared_total
        - attributed_amount
        - unattributed_amount
        - unallocated_amount
      properties:
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        currency_minor_units:
          type: integer
          minimum: 0
          maximum: 6
        declared_total:
          $ref: "#/components/schemas/DecimalString"
        attributed_amount:
          $ref: "#/components/schemas/DecimalString"
        unattributed_amount:
          $ref: "#/components/schemas/DecimalString"
        unallocated_amount:
          $ref: "#/components/schemas/DecimalString"

    CostViewData:
      type: object
      additionalProperties: false
      required:
        - period
        - breakdown
        - components
        - rows
        - currency_subtotals
        - calculated_at
        - disclaimer
      properties:
        period:
          $ref: "#/components/schemas/CostPeriodRef"
        breakdown:
          $ref: "#/components/schemas/CostBreakdown"
        component_filter:
          type: [string, "null"]
          default: null
        components:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/CostComponentSummary"
        rows:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/CostAllocationRow"
        currency_subtotals:
          type: array
          items:
            $ref: "#/components/schemas/CurrencySubtotal"
        calculated_at:
          type: string
          format: date-time
        latest_observed_at:
          type: [string, "null"]
          format: date-time
          default: null
        disclaimer:
          type: string
          const: Operational cost allocation from declared billed totals and observed usage; not an invoice or billing-accurate charge.

    ObservedRunCostDelta:
      description: |
        Additive optional observed-usage fields on ObservedRun. Null means not
        reported and must not be coerced to zero. Credit quantity is direct
        telemetry only. Only added properties are shown; existing run
        properties remain required as defined by spec 012.
      type: object
      properties:
        cache_read_tokens:
          type: [integer, "null"]
          minimum: 0
          default: null
        cache_write_tokens:
          type: [integer, "null"]
          minimum: 0
          default: null
        reasoning_tokens:
          type: [integer, "null"]
          minimum: 0
          default: null
        credits:
          oneOf:
            - $ref: "#/components/schemas/DecimalString"
            - type: "null"
          default: null
        credit_events:
          type: [integer, "null"]
          minimum: 0
          default: null

    CoverageCostDelta:
      description: |
        Additive fields and dimension member on CoverageResult. Only additions
        are shown; existing CoverageResult properties remain valid.
      type: object
      properties:
        dimension:
          type: string
          enum:
            - resource_access
            - telemetry_connection
            - recent_traces
            - agent_attribution
            - model_attribution
            - token_usage
            - trace_correlation
            - protected_content
            - tool_attribution
            - run_correlation
            - cost_attribution
        component_id:
          type: [string, "null"]
          default: null
        cost_breakdown:
          oneOf:
            - $ref: "#/components/schemas/CostBreakdown"
            - type: "null"
          default: null
        allocation_key:
          description: |
            Configured key for a component, or an observable allocation
            capability when component_id is null. It does not infer a billing
            component type or allocation model.
          oneOf:
            - $ref: "#/components/schemas/AllocationKey"
            - type: "null"
          default: null

    ObserveCostResponse:
      description: |
        Existing Observe response envelope. Only the cost-specific data arm is
        shown here; diagnostics, coverage, partial_failures, refreshed_at,
        cache_status, and bounds retain their existing contracts.
      type: object
      required:
        - data
        - coverage
        - diagnostics
        - partial_failures
        - refreshed_at
        - cache_status
      properties:
        data:
          $ref: "#/components/schemas/CostViewData"
        coverage:
          type: array
          items:
            type: object
        diagnostics:
          type: object
        partial_failures:
          type: array
          items:
            type: object
        refreshed_at:
          type: string
          format: date-time
        cache_status:
          type: string
        bounds:
          type: [object, "null"]
          default: null

    DecimalString:
      type: string
      pattern: "^(0|[1-9][0-9]*)(\\.[0-9]+)?$"
