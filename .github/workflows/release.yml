# AgentOps Toolkit — Production Release (PyPI + VSIX Stable)
#
# Workflows:
#   1. ci.yml          — Lint + test on every push/PR; VSIX build validation
#   2. _build.yml      — Reusable build (test + package), called by staging and release
#   3. staging.yml     — Staging: release/* → TestPyPI → verify; VSIX artifact only
#   4. release.yml     — Production: v* tag → TestPyPI → verify → PyPI → GH Release; VSIX stable → Marketplace
#   5. cut-release.yml — Manual dispatch: create release branch + PR from develop
#
# Triggered by v* tag pushes (e.g. v0.2.0), or via workflow_dispatch for re-triggering
# a failed release (select the v* tag ref, or supply the 'tag' input).
# Calls the reusable _build.yml, then publishes to TestPyPI for final
# verification, then to PyPI, publishes the VS Code extension as stable to
# the Marketplace, and finally creates a GitHub Release (with both dist and
# VSIX attached).
#
# WARNING: pushing a v* tag publishes to PyPI immediately.
#   The 'release' environment has no protection rules, so nothing pauses for a
#   human. PyPI does not allow re-uploading a version, so the tag push is the
#   point of no return; the only recovery is to yank and ship a new patch.
#   Verify on TestPyPI through staging.yml (release/* branch) BEFORE tagging.
#   To make this a real gate, see the "Enabling a real approval gate" section
#   in docs/release-process.md.
#
# Versioning:
#   Uses setuptools-scm — version is derived from the git tag automatically.
#   Tagged commit v0.2.0 → version 0.2.0. No manual version in pyproject.toml.
#   VSIX version is managed in plugins/agentops/package.json (synced by cut-release).
#   When using workflow_dispatch with the 'tag' input, the version is derived
#   from the tag name directly (strips the 'v' prefix).
#
# Trusted Publishing (OIDC):
#   This workflow uses PyPI Trusted Publishing — no API tokens required.
#   Authentication is handled via OpenID Connect (OIDC) between GitHub Actions
#   and PyPI/TestPyPI.
#
# Marketplace uses Entra OIDC, not a PAT. The separate marketplace-release
# environment requires protected deployment refs and dedicated identity variables:
# MARKETPLACE_AZURE_CLIENT_ID, MARKETPLACE_AZURE_TENANT_ID, MARKETPLACE_PROFILE_ID.
# See docs/release-process.md for approval, federation and rollout prerequisites.
#
# Required GitHub environments:
#   staging  — TestPyPI publish
#   release  — PyPI publish (unchanged)
#   Both exist only to scope Trusted Publishing. Neither has protection rules
#   today, so neither gates anything. Check with:
#     gh api repos/Azure/agentops/environments \
#       --jq '.environments[] | {name, protection_rules}'
#
# Setup (Trusted Publishing + VSCE):
#   1. https://test.pypi.org/manage/project/agentops-accelerator/settings/publishing/
#      → Add publisher: GitHub, owner=Azure, repo=agentops, workflow=release.yml, environment=staging
#   2. https://pypi.org/manage/project/agentops-accelerator/settings/publishing/
#      → Add publisher: GitHub, owner=Azure, repo=agentops, workflow=release.yml, environment=release
#   3. Configure marketplace-release, federate the dedicated managed identity,
#      and grant it Contributor on AgentOpsAccelerator (not Azure Contributor).
#      Python Trusted Publishing and the GitHub RELEASE_PAT are unchanged.
#   4. GitHub repo → Settings → Environments → Create "release" (the name must match
#      the publisher config in step 2). Required reviewers are NOT configured today,
#      so the PyPI publish runs unattended.
#
# Re-triggering a failed release:
#   Option A (recommended): Delete and re-push the tag (triggers this workflow automatically).
#   Option B: Actions → Release → Run workflow → select the v* tag ref → optionally set 'tag' input.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.3) — required when re-triggering a failed release via workflow_dispatch"
        required: false
        type: string

permissions:
  contents: write # For GitHub Release

jobs:
  # Reusable build: test + package
  build:
    uses: ./.github/workflows/_build.yml
    with:
      checkout_ref: ${{ inputs.tag || github.ref }}
      release_tag: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}

  # Publish to TestPyPI for final pre-release verification
  publish-testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      id-token: write # Required for PyPI Trusted Publishing (OIDC)
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          verbose: true
          skip-existing: true

  # Install from TestPyPI and smoke-test the CLI
  verify-testpypi:
    needs: publish-testpypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Determine expected version
        id: version
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            VERSION="${{ inputs.tag }}"
            VERSION="${VERSION#v}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            pip install setuptools-scm
            VERSION=$(python -m setuptools_scm)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Expected version: $VERSION"

      - name: Install from TestPyPI
        run: |
          # TestPyPI serves its simple index through a CDN, so a freshly
          # uploaded release is not immediately resolvable even after the
          # upload returns 200 OK. Allow ~6 minutes for it to propagate.
          ATTEMPTS=12
          for i in $(seq 1 "$ATTEMPTS"); do
            echo "Attempt $i/$ATTEMPTS: installing agentops-accelerator==${{ steps.version.outputs.version }}"
            if pip install --no-cache-dir \
              "agentops-accelerator==${{ steps.version.outputs.version }}" \
              --index-url https://test.pypi.org/simple/ \
              --extra-index-url https://pypi.org/simple/; then
              exit 0
            fi
            if [ "$i" -lt "$ATTEMPTS" ]; then
              echo "Not available yet, waiting 30s..."
              sleep 30
            fi
          done
          echo "::error::agentops-accelerator==${{ steps.version.outputs.version }} was not available from TestPyPI after $ATTEMPTS attempts (~6 min)."
          exit 1

      - name: Smoke test — version and help
        run: |
          agentops --version
          agentops --help

      - name: Smoke test — init in temp directory
        run: |
          TMPDIR=$(mktemp -d)
          cd "$TMPDIR"
          agentops init --no-prompt --azd-env testenv
          test -f agentops.yaml
          test -f .agentops/data/smoke.jsonl
          test -f .azure/config.json
          echo "✅ agentops init succeeded"

  # Publish to PyPI. The 'release' environment has no protection rules, so this
  # runs unattended as soon as verify-testpypi passes. The upload is irreversible:
  # PyPI refuses to re-upload a version, and yanking does not free the number.
  publish-pypi:
    needs: verify-testpypi
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write # Required for PyPI trusted publishing (OIDC)
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true
          skip-existing: true

  # ── VSIX Stable Publish ──────────────────────────────────────────────
  # Publish the VS Code extension as a stable release to the Marketplace.
  # Runs after PyPI publish so PyPI and Marketplace identity stay consistent on every release.
  publish-vsix:
    needs: [build, publish-pypi] # gate on successful lint + test (build) and on PyPI publish
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: marketplace-release
    permissions:
      contents: read
      id-token: write
    env:
      VSIX_FILE: agentops-skills.vsix
      MARKETPLACE_AZURE_TENANT_ID: ${{ vars.MARKETPLACE_AZURE_TENANT_ID }}
      MARKETPLACE_PROFILE_ID: ${{ vars.MARKETPLACE_PROFILE_ID }}
    steps:
      - name: Validate Marketplace release ref
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Marketplace stable publishing requires a vX.Y.Z release tag."
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$RELEASE_TAG" ]]; then
            echo "::error::The requested release tag must match the workflow tag ref."
            exit 1
          fi

      - name: Check out trusted publishing tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}

      - name: Check out release sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Full history for version derivation
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          path: release-source

      - name: Sync VSIX version from git tag
        working-directory: release-source
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # Derive version from the tag name directly (most reliable for releases)
          VERSION=${RELEASE_TAG#v}
          jq --arg v "$VERSION" '.version = $v' \
            plugins/agentops/package.json > plugins/agentops/package.json.tmp
          mv plugins/agentops/package.json.tmp plugins/agentops/package.json
          echo "VSIX version set to $VERSION (from tag $RELEASE_TAG)"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install vsce
        run: npm install -g @vscode/vsce@3.9.2

      - name: Set up Python for Marketplace preflight
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Authenticate Marketplace identity
        uses: ./.github/actions/marketplace-login
        with:
          client-id: ${{ vars.MARKETPLACE_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.MARKETPLACE_AZURE_TENANT_ID }}
          profile-id: ${{ vars.MARKETPLACE_PROFILE_ID }}

      - name: Copy root assets for VSIX
        working-directory: release-source
        run: |
          cp CHANGELOG.md plugins/agentops/CHANGELOG.md
          cp icon.png plugins/agentops/icon.png

      - name: Package VSIX
        working-directory: release-source/plugins/agentops
        run: vsce package -o "${VSIX_FILE}"

      - name: Publish stable to VS Code Marketplace
        # Preflight requires the exact profile and an explicit publishing role.
        # Only a duplicate-version publish error is tolerated on reruns.
        run: |
          python scripts/marketplace.py publish \
            --package-path "release-source/plugins/agentops/${VSIX_FILE}" --allow-already-exists

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: release-source/plugins/agentops/${{ env.VSIX_FILE }}

  # Create GitHub Release with built artifacts (Python dist + VSIX).
  # Gating: publish-pypi + publish-vsix MUST succeed.
  github-release:
    needs: [publish-pypi, publish-vsix]
    if: needs.publish-pypi.result == 'success' && needs.publish-vsix.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download Python dist artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Download VSIX artifact
        uses: actions/download-artifact@v8
        with:
          name: vsix
          path: vsix/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          ASSETS=(dist/* vsix/*)
          gh release create "$TAG" "${ASSETS[@]}" \
            --repo "${{ github.repository }}" \
            --title "$TAG" \
            --generate-notes
